# 电池电量报告间隔时间单位是秒
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# 增加键盘消抖
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
# 增加键盘的 BLE 无线电的发射功率，用解决延迟和左右通讯不佳的问题
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_POINTING=y
# display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_BAS=n
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=n

#soft off
CONFIG_ZMK_PM_SOFT_OFF=y

# === Cirque Pinnacle2 40mm Trackpad (I2C1) ===
# I2C1 used instead of I2C0 to avoid SPI0 display conflict (GP0.20/GP0.17)
# TODO: CONFIRM GPIO PINS before building
# Suggested placeholders: SDA=GP0.5, SCL=GP0.4, DRDY=GP0.3
CONFIG_I2C=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512
CONFIG_INPUT_QUEUE_MAX_MSGS=64
